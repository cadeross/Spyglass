name: Spyglass
options:
  bundleIdPrefix: com.cadeross
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  Spyglass:
    type: application
    platform: macOS
    sources: [Spyglass]
    info:
      path: Spyglass/Info.plist
      properties:
        CFBundleDisplayName: Spyglass
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Made with care (and a little salt water)."
        NSCameraUsageDescription: Spyglass shows your camera in a bubble and records it along with your screen.
        NSMicrophoneUsageDescription: Spyglass records your voice along with your screen.
    entitlements:
      path: Spyglass/Spyglass.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadeross.Spyglass
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
